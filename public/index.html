<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Confluence Stream Info</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="brand">
    <div class="mark"></div>
    <h1>Confluence Stream Info</h1>
    <div class="lang-toggle">
      <button type="button" data-lang="es" aria-label="Español" title="Español">🇪🇸</button>
      <button type="button" data-lang="en" aria-label="English" title="English">🇬🇧</button>
    </div>
  </div>
  <div class="suite-tag">Confluence Suite</div>

  <div class="platforms">
    <div class="platform-pill" data-platform="twitch" role="button" tabindex="0" data-i18n-aria="aria_toggle_twitch">
      <span class="name"><span class="platform-icon-holder"></span>Twitch</span>
      <span class="state">conectar</span>
    </div>
    <div class="platform-pill" data-platform="youtube" role="button" tabindex="0" data-i18n-aria="aria_toggle_youtube">
      <span class="name"><span class="platform-icon-holder"></span>YouTube</span>
      <span class="state">conectar</span>
    </div>
    <div class="platform-pill" data-platform="kick" role="button" tabindex="0" data-i18n-aria="aria_toggle_kick">
      <span class="name"><span class="platform-icon-holder"></span>Kick</span>
      <span class="state">conectar</span>
    </div>
  </div>

  <fieldset>
    <legend data-i18n="legend_shared_info">Info compartida</legend>
    <label for="title" data-i18n="label_title">Titulo</label>
    <input type="text" id="title" placeholder="Titulo del stream" data-i18n-placeholder="placeholder_title" />

    <label for="tags-input" data-i18n="label_tags">Tags (separados por coma)</label>
    <div class="tags-box" id="tags-box">
      <input type="text" id="tags-input" placeholder="español, fps, ranked" data-i18n-placeholder="placeholder_tags" autocomplete="off" />
    </div>
  </fieldset>

  <fieldset>
    <legend data-i18n="legend_category">Categoria por plataforma</legend>

    <div class="category-row" data-platform="twitch">
      <div class="platform-label" style="color:var(--twitch)"><span class="platform-icon-holder"></span>Twitch</div>
      <input type="text" class="category-search" placeholder="Buscar juego..." autocomplete="off" data-i18n-placeholder="placeholder_search_game" />
      <div class="results" hidden></div>
      <div class="selected-chip" hidden></div>
    </div>

    <div class="category-row" data-platform="kick">
      <div class="platform-label" style="color:var(--kick)"><span class="platform-icon-holder"></span>Kick</div>
      <input type="text" class="category-search" placeholder="Buscar categoria..." autocomplete="off" data-i18n-placeholder="placeholder_search_category" />
      <div class="results" hidden></div>
      <div class="selected-chip" hidden></div>
    </div>

    <div class="category-row" data-platform="youtube">
      <div class="platform-label" style="color:var(--youtube)"><span class="platform-icon-holder"></span>YouTube</div>
      <select id="youtube-category">
        <option value="20">Gaming</option>
        <option value="24">Entertainment</option>
        <option value="22">People &amp; Blogs</option>
        <option value="23">Comedy</option>
        <option value="10">Music</option>
      </select>
    </div>
  </fieldset>

  <div class="actions">
    <button class="primary" id="push-all" data-i18n="btn_publish_all">Publicar a las 3</button>
  </div>
  <div class="actions">
    <button class="small" data-push="twitch" data-i18n="btn_only_twitch">Solo Twitch</button>
    <button class="small" data-push="youtube" data-i18n="btn_only_youtube">Solo YouTube</button>
    <button class="small" data-push="kick" data-i18n="btn_only_kick">Solo Kick</button>
  </div>
  <div class="actions" id="twitch-clip-row" hidden>
    <button class="small" id="clip-twitch" data-i18n="btn_clip_twitch">Crear clip (Twitch)</button>
  </div>
  <div class="actions">
    <button class="small" id="save-all" data-i18n="btn_save_all">Guardar todo</button>
    <button class="small" id="clear-all" data-i18n="btn_clear_all">Limpiar todo</button>
  </div>

  <div class="log-toolbar">
    <button type="button" class="log-clear" id="log-clear" data-i18n="btn_clear_log">Limpiar log</button>
  </div>
  <div class="results-log" id="log"></div>

  <div class="credit">Confluence — by NOX TAIPAN</div>

  <script src="platform-icons.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
